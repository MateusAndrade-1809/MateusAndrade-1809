name: Deploy portifólio-MateusAndrade

on:
  push:
    branches:
      - main
    paths:
      - "github-pages/**"
      - "portfolio/**"
      - ".github/workflows/portifolio-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portifolio-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        working-directory: portfolio
        run: npm ci

      - name: Check code and test
        working-directory: portfolio
        run: |
          npm run lint
          npm test

      - name: Build portfolio
        working-directory: portfolio
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/github-pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
